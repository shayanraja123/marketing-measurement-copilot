[project]
name = "marketing-measurement-copilot"
version = "0.1.0"
description = "Estimate true ad-channel ROI, optimize budgets, and explain results through an LLM copilot"
readme = "README.md"
requires-python = ">=3.12"  # PyMC-Marketing 1.5 needs 3.12+
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "dbt-core>=1.9,<1.11",
    "dbt-duckdb>=1.9,<1.11",
    "dbt-bigquery>=1.9,<1.11",
    "google-cloud-bigquery>=3.20",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-dbt>=0.25",
    "pymc-marketing>=1.5",
    "mlflow>=2.15",
]

[tool.setuptools]
packages = ["simulator", "pipeline", "orchestration", "measurement"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.dagster]
module_name = "orchestration.definitions"
