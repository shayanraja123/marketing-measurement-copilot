version: 2

# Tests run with `dbt build` or `dbt test`. Each one is a query that returns the rows breaking a rule;
# zero rows means it passes. severity: warn reports a problem without stopping the build.

models:
  - name: stg_google_ads__daily
    description: Paid search spend and platform-reported conversions, one row per day, campaign and region.
    columns: &ad_platform_columns
      - name: ad_spend_id
        description: Day, campaign and region joined into one key.
        tests: [unique, not_null]
      - name: date_day
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: region
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region
      - name: spend
        tests: [not_null, non_negative]
      - name: platform_conversion_value
        tests: [non_negative]

  - name: stg_meta_ads__daily
    description: Paid social spend, duplicates removed, one row per day, campaign and region.
    columns:
      - name: ad_spend_id
        tests: [unique, not_null]
      - name: date_day
        tests: [not_null]
      - name: region
        tests:
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region
      - name: spend
        tests: [not_null, non_negative]
      - name: impressions
        description: A few are blank in the export. Kept as NULL rather than guessed.
        tests:
          - not_null:
              config:
                severity: warn

  - name: stg_tiktok_ads__daily
    description: TikTok spend with currency text converted to numbers.
    columns: *ad_platform_columns

  - name: stg_display__daily
    description: Display spend with UTC timestamps converted to the brand's local date.
    columns: *ad_platform_columns

  - name: stg_email__daily
    description: Email cost and sends; emails sent are stored as impressions.
    columns: *ad_platform_columns

  - name: stg_shop__orders
    description: All store orders, including late-arriving ones, one row per order.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_date
        tests: [not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__customers')
                field: customer_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_shop__products')
                field: product_id
      - name: region
        tests:
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region
      - name: revenue
        tests: [not_null, non_negative]

  - name: stg_shop__customers
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: stg_shop__products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_shop__price_history
    columns:
      - name: price_change_id
        tests: [unique, not_null]
      - name: price
        tests: [not_null, non_negative]

  - name: stg_ads__campaign_settings
    columns:
      - name: campaign_change_id
        tests: [unique, not_null]
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: [paid_search, paid_social, tiktok, display, email]

  - name: stg_regions
    columns:
      - name: region
        tests: [unique, not_null]

  - name: stg_geo_experiments
    columns:
      - name: experiment_id
        tests: [unique, not_null]
